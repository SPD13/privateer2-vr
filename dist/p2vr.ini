[VR]
; ---- VR (milestone 1) ----
VR_ENABLE=1
; game units per metre: scales head movement and eye separation (higher = stronger depth / smaller world)
WORLD_SCALE=10
; multiplier on SteamVR's recommended eye resolution (capped at 2048 by BRender)
EYE_SCALE=1.0
; clear the game's 3D image after rendering so the monitor/HUD layer shows only the HUD
HUD_CLEAR=1
HUD_DIST=1.0
HUD_WIDTH=1.5
HUD_Y=0
; crosshair layer: placed on the ship boresight this far away (metres) so it lines up with the lasers
RETICLE_DIST=30
; size of the crosshair region (fraction of HUD width)
RETICLE_SIZE=0.16
HUD_KEY_GAIN=40
HUD_KEY_THRESHOLD=0.03
SCREEN_DIST=2.5
SCREEN_WIDTH=3.2
; ---- spike tools (only when VR is not active) ----
MODE=0
IPD=1.0
SWEEP_DEG=25
FOV_SCALE=1.0
EYE_W=1440
EYE_H=1440

; ---- stars ----
STAR_SIZE=2
STAR_SPRITES=1
; ---- dust / flare ----
DUST=1
DUST_SCALE=1.0
LENS_FLARE=1
