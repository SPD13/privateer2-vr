[VR]
; ---- VR (milestone 1) ----
VR_ENABLE=1
; game units per metre: scales head movement and eye separation (higher = stronger depth / smaller world)
WORLD_SCALE=10
; multiplier on SteamVR's recommended eye resolution (capped at 2048 by BRender)
EYE_SCALE=1.0
; largest eye render size in pixels (BRender's 2048 limit is lifted above that; 2048 = original safe limit)
EYE_MAX=4096
; clear the game's 3D image after rendering so the monitor/HUD layer shows only the HUD
HUD_CLEAR=1
HUD_DIST=1.0
; HUD_WIDTH 0 = exactly the game's field of view at HUD_DIST
; the eyes sit this far (metres) behind the ship centre, so nothing can come in front of the HUD plane
OBSERVER_BACK=1.0
; draw your own ship (visible from behind once OBSERVER_BACK > 0)
SHOW_OWN_SHIP=0
HUD_WIDTH=0
HUD_Y=0
; crosshair distance in metres on the ship boresight (500 = optically at infinity, like a real HUD); 0 = keep it in the HUD panel. Target markers are placed at the depth of the object they mark.
RETICLE_DIST=500
; draw crosshair + lead indicator into the 3D image at infinity, so nearer ships cover them (0 = separate layer on top)
RETICLE_IN_EYES=1
; crosshair on the HUD glass (1 m panel) with this opacity (overrides RETICLE_IN_EYES)
RETICLE_GLASS=1
RETICLE_GLASS_ALPHA=0.9
; the HUD's yellow target-direction arrow is taken out of the HUD image and shown as its own layer on the HUD glass
; (like the other direction arrows), so it is never cut by the HUD panels and passes behind them (0 = part of the HUD)
HUD_ARROW_LAYER=1
RETICLE_DYNAMIC=0
RETICLE_MIN_DIST=1.5
; size of the crosshair region (fraction of HUD width; must contain the whole crosshair cluster incl. pitch/yaw ladders)
RETICLE_SIZE=0.20
HUD_KEY_GAIN=40
HUD_KEY_THRESHOLD=0.03
SCREEN_DIST=2.5
SCREEN_WIDTH=3.2
; fade through black when switching between the flight view and a flat screen (nav map, menus): 1 = on, 0 = off
TRANSITION_FADE=1
TRANSITION_FADE_MS=500
; ---- spike tools (only when VR is not active) ----
MODE=0
IPD=1.0
SWEEP_DEG=25
FOV_SCALE=1.0
EYE_W=1440
EYE_H=1440

; ---- stars ----
STAR_SIZE=2
STAR_SPRITES=1
; ---- dust / flare ----
DUST=1
DUST_SCALE=1.0
LENS_FLARE=1
; diagnostic: log objects appearing near the ship
ACTOR_LOG=0
; ---- shots ----
; VR only: shots appear to leave from wider gun points (factor on sideways offset, fades to 1 at the distance in game units)
LASER_WIDEN=3.0
LASER_WIDEN_DIST=60
; ---- test macro: Ctrl+F2 record/stop, Ctrl+F3 replay/abort; replays macro.txt at game start ----
; (VR controller input is ignored during a replay; Esc on the keyboard or VR controller stops it)
AUTOPLAY=0
; ---- smoothing: 0 = off (30 Hz), 1 = interpolate (smooth, ~1 game frame delay), 2 = extrapolate (no delay, may overshoot) ----
SMOOTH=1
; start recording the input macro at game start (Ctrl+F2 stops and saves to macro.txt)
AUTORECORD=0
; ---- VR controllers (actions remappable in SteamVR > Controller bindings) ----
VR_CONTROLS=1
STICK_DEADZONE=0.15
INVERT_PITCH=0
INVERT_ROLL=0
ROLL_GAIN=2.5
; throttle change per second at full left-stick deflection (0..1 range)
THROTTLE_RATE=0.6
; a joystick configured in p2den (Alt+J) works alongside the VR controllers: an axis is only taken from the VR sticks while
; they are deflected; set the game's control method to Joystick for its Alt+J mapping (0 = VR sticks always win)
JOYSTICK_PASSTHROUGH=1
; Every game command is a SteamVR action (SteamVR > Controller bindings > Privateer 2 VR); unbound ones do nothing.
; override a command's game key with KEY_<COMMAND>=<DirectInput scancode, decimal>, e.g. KEY_FIRE_GUNS=57
; (all settings are documented in SETTINGS.md in the repo)
; screens that draw the cursor offset from the mouse (PAD, nav map): the VR pointer puts the drawn cursor on the beam
CURSOR_FIX=1
; ---- controller rumble (amplitude 0..1; 0 = off for that event) ----
RUMBLE=1
RUMBLE_GUNS=0.35
RUMBLE_HIT=0.9
; no rumble when the flight is started with the joystick's fire button at the Entering Space prompt: 1 = on, 0 = rumble anyway
RUMBLE_JOYSTICK_OFF=1
; ---- bHaptics TactSuit (with bHaptics Player running; strengths 0..1, 0 = off for that effect) ----
BHAPTICS=1
BHAPTICS_INTENSITY=1.0
BHAPTICS_SHOTS=0.35
BHAPTICS_HITS=1.0
BHAPTICS_MISSILE=0.8
BHAPTICS_AFTERBURNER=0.3
BHAPTICS_JUMP=0.7
BHAPTICS_HEARTBEAT=0.5
; armour left (percent) below which a heartbeat plays; 0 = none
BHAPTICS_HEARTBEAT_BELOW=35
; 1 = start bHaptics Player with the game
BHAPTICS_LAUNCH_PLAYER=0
; ---- cheats (in flight): Ctrl+1 restore shield/armor, Ctrl+2 destroy target, Ctrl+3 destroy all enemies,
; Ctrl+4 +100,000 credits, Ctrl+5 invincible on/off, Ctrl+6 next jump straight to the destination, Ctrl+7 land now,
; Ctrl+8 fast forward 2x on/off;
; also SteamVR actions "[CHEAT] ..." (bind them in SteamVR)
CHEATS=1
; joystick buttons for the cheats (Windows button number, 0 = none); leave those buttons unmapped in Alt+J
CHEAT_RESTORE_BUTTON=0
CHEAT_DESTROY_TARGET_BUTTON=0
CHEAT_DESTROY_ENEMIES_BUTTON=0
CHEAT_CASH_BUTTON=0
CHEAT_INVINCIBLE_BUTTON=0
CHEAT_JUMP_BUTTON=0
CHEAT_LAND_BUTTON=0
CHEAT_SPEED_BUTTON=0
; maximize the game window at start: p2den renders the 2D screens/films at the window size, so this makes them sharper in VR
WINDOW_MAXIMIZE=1
; when a mission starts (launch into space), hold it with "Entering Space in VR. Press the fire button to continue"
; until fire is pressed: VR fire_guns action, or the mouse / joystick button mapped to fire in p2den (0 = start flying immediately)
SPACE_PROMPT=1
; ---- HUD panels: HUD parts shown as separate panels on a sphere around you (0 = one flat HUD) ----
HUD_PANELS=1
; sphere radius in metres (distance of the panels from your head)
PANEL_RADIUS=0.8
; PANEL_<NAME>=x0,y0,x1,y1 (HUD pixels of the 640x480 HUD), azimuth (deg, + right), elevation (deg, + up), width (m) [, radius (m)]
; every panel faces you; PANEL_<NAME>=0 removes it (at most 8 panels)
PANEL_VELOCITY=236,0,406,58, 0,24, 0.36
PANEL_COMMS=0,0,124,190, -34,18, 0.24
PANEL_TARGET=2,342,120,478, -44,-22, 0.28
PANEL_TARGET_SHIELDS=138,382,254,476, -22,-26, 0.24
PANEL_RADAR=254,338,388,478, 0,-28, 0.30
PANEL_SHIELDS=388,382,504,476, 22,-26, 0.24
PANEL_RIGHT=504,342,640,478, 44,-22, 0.28
PANEL_MISSILES=516,0,640,124, 34,22, 0.24
PANEL_GUNS=520,124,640,264, 40,4, 0.24
PANEL_MINES=520,264,640,342, 40,-11, 0.24
