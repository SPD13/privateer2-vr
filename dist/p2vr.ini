[VR]
; ---- VR (milestone 1) ----
VR_ENABLE=1
; game units per metre: scales head movement and eye separation (higher = stronger depth / smaller world)
WORLD_SCALE=10
; multiplier on SteamVR's recommended eye resolution (capped at 2048 by BRender)
EYE_SCALE=1.0
; largest eye render size in pixels (BRender's 2048 limit is lifted above that; 2048 = original safe limit)
EYE_MAX=4096
; clear the game's 3D image after rendering so the monitor/HUD layer shows only the HUD
HUD_CLEAR=1
HUD_DIST=1.0
; HUD_WIDTH 0 = exactly the game's field of view at HUD_DIST
; the eyes sit this far (metres) behind the ship centre, so nothing can come in front of the HUD plane
OBSERVER_BACK=1.0
; draw your own ship (visible from behind once OBSERVER_BACK > 0)
SHOW_OWN_SHIP=0
HUD_WIDTH=0
HUD_Y=0
; crosshair distance in metres on the ship boresight (500 = optically at infinity, like a real HUD); 0 = keep it in the HUD panel. Target markers are placed at the depth of the object they mark.
RETICLE_DIST=500
; draw crosshair + lead indicator into the 3D image at infinity, so nearer ships cover them (0 = separate layer on top)
RETICLE_IN_EYES=1
; crosshair on the HUD glass (1 m panel) with this opacity (overrides RETICLE_IN_EYES)
RETICLE_GLASS=1
RETICLE_GLASS_ALPHA=0.5
RETICLE_DYNAMIC=0
RETICLE_MIN_DIST=1.5
; size of the crosshair region (fraction of HUD width; must contain the whole crosshair cluster incl. pitch/yaw ladders)
RETICLE_SIZE=0.20
HUD_KEY_GAIN=40
HUD_KEY_THRESHOLD=0.03
SCREEN_DIST=2.5
SCREEN_WIDTH=3.2
; ---- spike tools (only when VR is not active) ----
MODE=0
IPD=1.0
SWEEP_DEG=25
FOV_SCALE=1.0
EYE_W=1440
EYE_H=1440

; ---- stars ----
STAR_SIZE=2
STAR_SPRITES=1
; ---- dust / flare ----
DUST=1
DUST_SCALE=1.0
LENS_FLARE=1
; diagnostic: log objects appearing near the ship
ACTOR_LOG=0
; ---- shots ----
; VR only: shots appear to leave from wider gun points (factor on sideways offset, fades to 1 at the distance in game units)
LASER_WIDEN=3.0
LASER_WIDEN_DIST=60
; ---- test macro: Ctrl+F2 record/stop, Ctrl+F3 replay/abort; replays macro.txt at game start ----
AUTOPLAY=1
; ---- smoothing: 0 = off (30 Hz), 1 = interpolate (smooth, ~1 game frame delay), 2 = extrapolate (no delay, may overshoot) ----
SMOOTH=1
; start recording the input macro at game start (Ctrl+F2 stops and saves to macro.txt)
AUTORECORD=0
